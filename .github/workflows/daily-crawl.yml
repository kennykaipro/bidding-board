name: 每日抓取招投标数据

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/data.json'
  schedule:
    - cron: '0 22 * * *' # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pycryptodome lxml

      - name: Run crawler
        run: python scripts/crawler.py --days 30

      - name: Commit data
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "源数据无变化，跳过提交"
          else
            git commit -m "chore: daily crawl $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
