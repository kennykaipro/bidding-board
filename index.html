<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招投标项目情报看板 · 信息化/智能化/音视频</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1f2937;
    --ink-2: #6b7280;
    --line: #e5e7eb;
    --brand: #1d4ed8;
    --brand-soft: #eff4ff;
    --ok: #047857;
    --ok-soft: #ecfdf5;
    --warn: #b45309;
    --warn-soft: #fffbeb;
    --danger: #be123c;
    --danger-soft: #fff1f2;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 1px 2px rgba(16, 24, 40, .04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 48px; }
  header.hero {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 12px; padding: 4px 2px 16px;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: .5px; }
  h1 .accent { color: var(--brand); }
  .meta { color: var(--ink-2); font-size: 13px; }
  .admin-link { color: var(--brand); text-decoration: none; font-weight: 600; margin-left: 4px; }
  .admin-link:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
  .stat b { display: block; font-size: 24px; color: var(--brand); }
  .stat span { color: var(--ink-2); font-size: 12px; }
  .filters {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 18px; display: flex;
    flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .filters .group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters label { font-size: 13px; color: var(--ink-2); margin-right: 2px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px;
    padding: 5px 13px; font-size: 13px; cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .chip.active { background: var(--brand); border-color: var(--brand); color: #fff; }
  .search {
    flex: 1 1 220px; display: flex; gap: 8px; align-items: center;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; background: #fff;
  }
  .search input { border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent; color: var(--ink); }
  .result-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; color: var(--ink-2); font-size: 13px; }
  .result-head b { color: var(--ink); }
  .list { display: grid; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px;
    grid-template-columns: 92px 1fr;
  }
  .item .left { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .date { font-size: 12px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; border-radius: 6px; padding: 2px 8px; }
  .tag.prov { background: var(--brand-soft); color: var(--brand); }
  .tag.stage-tb { background: var(--ok-soft); color: var(--ok); }
  .tag.stage-other { background: var(--warn-soft); color: var(--warn); }
  .tag.stage-fix { background: var(--danger-soft); color: var(--danger); }
  .tag.kw { background: #f3f4f6; color: var(--ink-2); }
  .tag.src { background: #eef2ff; color: #4338ca; }
  .item h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .item a { color: var(--ink); text-decoration: none; }
  .item a:hover { color: var(--brand); text-decoration: underline; }
  .empty {
    text-align: center; color: var(--ink-2); padding: 48px 16px; background: var(--card);
    border: 1px dashed var(--line); border-radius: var(--radius);
  }
  footer { margin-top: 26px; color: var(--ink-2); font-size: 12px; }
  @media (max-width: 640px) {
    .item { grid-template-columns: 1fr; }
    .item .left { flex-direction: row; flex-wrap: wrap; align-items: center; }
    h1 { font-size: 20px; }
  }
  @media print {
    body { background: #fff; }
    .filters, .stats { display: none; }
    .item { box-shadow: none; break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div>
      <h1>招投标项目情报看板 <span class="accent">· 信息化 / 智能化 / 音视频</span></h1>
      <div class="meta">数据来源：中国政府采购网 · 南方电网 ｜ 更新：<span id="updated"></span> ｜ 追踪范围：广东 / 浙江 / 江苏 / 山东 ｜ <a class="admin-link" href="https://kennykaipro.github.io/bidding-board/admin.html" target="_blank" rel="noopener noreferrer">＋ 添加数据源</a></div>
    </div>
  </header>

  <section class="stats" aria-label="概览统计">

    <div class="stat"><b id="stGd">0</b><span>广东</span></div>
    <div class="stat"><b id="stZj">0</b><span>浙江</span></div>
    <div class="stat"><b id="stJs">0</b><span>江苏</span></div>
    <div class="stat"><b id="stSd">0</b><span>山东</span></div>
  </section>

  <section class="filters" aria-label="筛选">
    <div class="group" role="group" aria-label="省份筛选">
      <label>省份</label>
      <button class="chip active" data-prov="all">全部</button>
      <button class="chip" data-prov="广东">广东</button>
      <button class="chip" data-prov="浙江">浙江</button>
      <button class="chip" data-prov="江苏">江苏</button>
      <button class="chip" data-prov="山东">山东</button>
    </div>
    <div class="group" role="group" aria-label="阶段筛选">
      <label>阶段</label>
      <button class="chip active" data-stage="all">全部</button>
      <button class="chip" data-stage="招标公告">招标</button>
      <button class="chip" data-stage="中标公告">中标</button>
      <button class="chip" data-stage="成交公告">成交</button>
      <button class="chip" data-stage="更正公告">更正</button>
      <button class="chip" data-stage="其他">其他</button>
    </div>
    <div class="group" id="srcGroup" role="group" aria-label="来源筛选">
      <label>来源</label>
      <button class="chip active" data-src="all">全部</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="搜索标题关键词，如：智慧校园、监控、音视频…" aria-label="关键词搜索">
    </div>
  </section>

  <div class="result-head"><span>共 <b id="shown">0</b> 条结果</span><span>按日期倒序</span></div>
  <div class="list" id="list" aria-live="polite"></div>
  <div class="empty" id="empty" hidden>没有符合条件的项目，换个筛选条件试试。</div>

  <footer>本看板数据由程序每日自动抓取生成，仅供业务线索参考；以中国政府采购网原文为准。</footer>
</div>

<script>

  "use strict";

: "中国政府采购网", "source_kind": "政府", "province": "浙江", "matched_keywords": ["智慧"]}], "errors": ["https://www.bidding.csg.cn/zbgg/: HTTP Error 404: Not Found"], "sources": [{"key": "ccgp", "name": "中国政府采购网", "kind": "政府"}, {"key": "csg", "name": "南方电网供应链统一服务平台", "kind": "央企"}, {"key": "example_gkzb", "name": "中国政府采购网·公开招标(示例)", "kind": "自定义"}]}; } catch (e) { DATA = { items: [] }; }

  var items = DATA.items || [];
  var provMap = { "广东": "stGd", "浙江": "stZj", "江苏": "stJs", "山东": "stSd" };

  function stageClass(stage) {
    if (stage === "招标公告" || stage === "竞争性磋商" || stage === "竞争性谈判") return "stage-tb";
    if (stage === "中标公告" || stage === "成交公告") return "stage-tb";
    if (stage === "更正公告") return "stage-fix";
    return "stage-other";
  }
  function stageGroup(stage) {
    if (stage === "招标公告" || stage === "竞争性磋商" || stage === "竞争性谈判") return "招标";
    if (stage === "中标公告" || stage === "成交公告") return "中标/成交";
    if (stage === "更正公告") return "更正";
    return "其他";
  }

  function renderStats() {
    var total = items.length;
    document.getElementById("stTotal").textContent = total;
    var counts = { "广东": 0, "浙江": 0, "江苏": 0, "山东": 0 };
    items.forEach(function (it) { if (counts[it.province] !== undefined) counts[it.province]++; });
    Object.keys(counts).forEach(function (p) {
      document.getElementById(provMap[p]).textContent = counts[p];
    });
    document.getElementById("updated").textContent = DATA.generated_at || "";
  }

  function renderSources() {
    var box = document.getElementById("srcGroup");
    if (!box) return;
    var seen = {};
    items.forEach(function (it) {
      if (it.source && !seen[it.source]) {
        seen[it.source] = true;
        var b = document.createElement("button");
        b.className = "chip";
        b.setAttribute("data-src", it.source);
        b.textContent = it.source_name || it.source;
        box.appendChild(b);
      }
    });
  }

  var state = { prov: "all", stage: "all", src: "all", q: "" };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function highlight(title, q) {
    var t = esc(title);
    if (!q) return t;
    var safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    var re = new RegExp("(" + safe + ")", "gi");
    return t.replace(re, "<mark>$1</mark>");
  }

  function render() {
    var q = state.q.trim().toLowerCase();
    var shown = items.filter(function (it) {
      if (state.prov !== "all" && it.province !== state.prov) return false;
      if (state.src !== "all" && it.source !== state.src) return false;
      if (state.stage !== "all") {
        var g = stageGroup(it.stage);
        if (state.stage === "其他") { if (g !== "其他") return false; }
        else if (g !== state.stage && it.stage !== state.stage) return false;
      }
      if (q && it.title.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });

    document.getElementById("shown").textContent = shown.length;
    document.getElementById("empty").hidden = shown.length !== 0;
    var list = document.getElementById("list");
    list.innerHTML = "";
    shown.forEach(function (it) {
      var el = document.createElement("article");
      el.className = "item";
      var tags = [];
      tags.push('<span class="tag src">' + esc(it.source_name || it.source) + '</span>');
      tags.push('<span class="tag prov">' + esc(it.province) + '</span>');
      tags.push('<span class="tag ' + stageClass(it.stage) + '">' + esc(stageGroup(it.stage)) + '</span>');

        tags.push('<span class="tag kw">' + esc(k) + '</span>');
      });

      document.querySelectorAll(".filters .chip").forEach(function (c) {
        if (c.parentElement.getAttribute("aria-label") === group) c.classList.remove("active");
      });
      chip.classList.add("active");
      state[key] = chip.getAttribute("data-" + key);
      render();
    });
  });

  document.getElementById("q").addEventListener("input", function () {
    state.q = this.value;
    render();
  });

  renderStats();
  render();
})();
</script>
</body>
